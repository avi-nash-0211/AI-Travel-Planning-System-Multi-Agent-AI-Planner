<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="AI Travel Planning System using LangGraph banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120b2e"/>
      <stop offset="0.45" stop-color="#2d1b5a"/>
      <stop offset="0.72" stop-color="#7a2d6e"/>
      <stop offset="0.90" stop-color="#e8636a"/>
      <stop offset="1" stop-color="#ffa86b"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0620" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0a0620" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#ff9a8b"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b3"/>
      <stop offset="1" stop-color="#ff9e6b"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="400" fill="url(#sky)"/>
    <rect width="1280" height="400" fill="url(#shade)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="640" cy="40" r="1.3" opacity="0.7"/>
      <circle cx="700" cy="78" r="1" opacity="0.5"/>
      <circle cx="790" cy="30" r="1.4" opacity="0.8"/>
      <circle cx="880" cy="62" r="1" opacity="0.5"/>
      <circle cx="950" cy="26" r="1.2" opacity="0.7"/>
      <circle cx="1040" cy="58" r="1.5" opacity="0.8"/>
      <circle cx="1110" cy="30" r="1" opacity="0.5"/>
      <circle cx="1180" cy="66" r="1.3" opacity="0.7"/>
      <circle cx="1240" cy="34" r="1" opacity="0.6"/>
      <circle cx="560" cy="90" r="1" opacity="0.4"/>
      <circle cx="1140" cy="104" r="1" opacity="0.5"/>
      <circle cx="720" cy="140" r="1" opacity="0.4"/>
    </g>

    <!-- sun -->
    <circle cx="1010" cy="318" r="190" fill="url(#sunGlow)"/>
    <circle cx="1010" cy="318" r="78" fill="url(#sun)"/>

    <!-- flight path -->
    <path d="M600 230 Q820 30 1200 150" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
    <g fill="#ffffff">
      <circle cx="600" cy="230" r="7" fill="#fff7ea"/>
      <circle cx="764.4" cy="132.2" r="7" fill="#fff7ea"/>
      <circle cx="964.4" cy="105.6" r="7" fill="#fff7ea"/>
      <circle cx="1200" cy="150" r="7" fill="#fff7ea"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.35">
      <circle cx="600" cy="230" r="13"/>
      <circle cx="764.4" cy="132.2" r="13"/>
      <circle cx="964.4" cy="105.6" r="13"/>
      <circle cx="1200" cy="150" r="13"/>
    </g>
    <!-- paper plane -->
    <g transform="translate(1246,163) rotate(18)">
      <path d="M12 0 L-16 -11 L-9 0 L-16 11 Z" fill="#ffffff"/>
      <path d="M-9 0 L12 0" stroke="#d9c7e8" stroke-width="1"/>
    </g>

    <!-- hills -->
    <path d="M0 330 C200 300 380 350 600 325 C800 300 1000 345 1280 315 L1280 400 L0 400 Z" fill="#4a2468"/>
    <path d="M0 360 C240 335 440 375 700 350 C900 332 1100 372 1280 345 L1280 400 L0 400 Z" fill="#2b1646"/>
    <path d="M0 386 C300 366 600 396 900 376 C1080 366 1200 386 1280 378 L1280 400 L0 400 Z" fill="#170d2b"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- stop labels -->
    <g font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="1">
      <text x="600" y="256">FLIGHT</text>
      <text x="764" y="158">HOTEL</text>
      <text x="964" y="132">ITINERARY</text>
      <text x="1200" y="176">FINAL</text>
    </g>

    <!-- title block -->
    <line x1="72" y1="82" x2="104" y2="82" stroke="#ffd9a0" stroke-width="2"/>
    <text x="116" y="87" font-size="13" font-weight="600" fill="#f3dcc8" letter-spacing="3">MULTI-AGENT AI SYSTEM</text>

    <text x="72" y="160" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="-1.5">AI Travel Planning</text>
    <text x="72" y="224" font-size="58" font-weight="700" fill="url(#word)" letter-spacing="-1.5">System</text>
    <text x="72" y="270" font-size="28" font-weight="500" fill="#ffffff" fill-opacity="0.9" letter-spacing="-0.3">using LangGraph</text>

    <text x="72" y="312" font-size="18" fill="#ffffff" fill-opacity="0.88">Four agents work together to plan a complete trip.</text>
    <text x="72" y="375" font-size="12" fill="#e9d5f5" fill-opacity="0.75" letter-spacing="1.5">LANGGRAPH   /   GROQ   /   POSTGRESQL   /   STREAMLIT</text>
  </g>
</svg>
